[workspace]
resolver = "2"
members = ["apps/desktop/src-tauri", "crates/cli", "crates/core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.0"
license = "MIT"

[workspace.lints.rust]
future-incompatible = "warn"
missing-docs = "warn"
nonstandard-style = "deny"
unsafe-code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
expect-used = "deny"
redundant-clone = "warn"
todo = "deny"
unimplemented = "deny"
unwrap-used = "deny"
