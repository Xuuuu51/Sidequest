<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Sidequest</title>
  <desc id="desc">A local-first memory layer that saves side ideas without interrupting the developer's main flow.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FAFAF8"/>
      <stop offset="0.58" stop-color="#F3F3F0"/>
      <stop offset="1" stop-color="#ECEDEA"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="1198" height="388" rx="28" fill="url(#background)" stroke="#D4D6D2"/>

  <g transform="translate(64 55)">
    <text fill="#527ACD" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="600" letter-spacing="2">LOCAL-FIRST PROJECT MEMORY</text>
    <text y="89" fill="#202124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="72" font-weight="700" letter-spacing="-2">Side</text>
    <text x="154" y="89" fill="#202124" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="67" font-weight="650" letter-spacing="-3">quest</text>
    <text y="143" fill="#4C5055" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="27" font-weight="450">Keep building without losing the ideas</text>
    <text y="181" fill="#4C5055" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="27" font-weight="450">worth coming back to.</text>

    <g transform="translate(0 231)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">
      <text fill="#73777D">macOS</text>
      <circle cx="78" cy="-6" r="3" fill="#B4B7B3"/>
      <text x="96" fill="#73777D">plain Markdown</text>
      <circle cx="262" cy="-6" r="3" fill="#B4B7B3"/>
      <text x="280" fill="#73777D">Rust core</text>
      <circle cx="394" cy="-6" r="3" fill="#B4B7B3"/>
      <text x="412" fill="#73777D">sq CLI</text>
    </g>
  </g>

  <g transform="translate(724 54)">
    <text x="22" y="18" fill="#73777D" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="1.4">CURRENT FLOW</text>

    <path d="M44 54 C44 103 186 103 186 154 C186 205 76 205 76 260 C76 283 96 296 132 296 L388 296" fill="none" stroke="#527ACD" stroke-width="12" stroke-linecap="round"/>
    <circle cx="44" cy="54" r="10" fill="#527ACD"/>
    <circle cx="388" cy="296" r="10" fill="#527ACD"/>

    <path d="M182 154 C235 154 250 205 308 205" fill="none" stroke="#A66F28" stroke-width="12" stroke-linecap="round"/>
    <circle cx="308" cy="205" r="11" fill="#A66F28"/>

    <g transform="translate(220 50)">
      <rect width="206" height="62" rx="14" fill="#FFFFFF" stroke="#D2D5D1"/>
      <text x="20" y="27" fill="#73777D" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">MAIN QUEST</text>
      <text x="20" y="49" fill="#202124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20">Keep building</text>
    </g>

    <g transform="translate(234 218)">
      <text fill="#A66F28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="600">SIDEQUEST SAVED</text>
      <text y="28" fill="#595D62" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">.sidequest/quests/…md</text>
