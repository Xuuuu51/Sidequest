<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">How Sidequest connects capture, local storage, and recall</title>
  <desc id="desc">The desktop app, Quick Capture, CLI, and coding agents all use one Rust core to safely store Markdown Quest files that can be recalled through the board, search, or CLI.</desc>

  <rect x="1" y="1" width="1198" height="428" rx="26" fill="#151A20" stroke="#363E47"/>
  <text x="56" y="60" fill="#8C929B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="1.6">ONE MEMORY · EVERY INTERFACE</text>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g transform="translate(56 98)">
      <text y="25" fill="#ECECEF" font-size="26" font-weight="650">Capture</text>
      <text y="58" fill="#9CA2AA" font-size="19">Leave the current flow intact.</text>
      <g transform="translate(0 91)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">
        <rect width="270" height="52" rx="12" fill="#20262D" stroke="#3C444E"/>
        <circle cx="25" cy="26" r="6" fill="#7AA2F7"/>
        <text x="45" y="33" fill="#D7D9DD">Quick Capture</text>
        <rect y="64" width="270" height="52" rx="12" fill="#20262D" stroke="#3C444E"/>
        <circle cx="25" cy="90" r="6" fill="#7AA2F7"/>
        <text x="45" y="97" fill="#D7D9DD">Desktop app</text>
        <rect y="128" width="270" height="52" rx="12" fill="#20262D" stroke="#3C444E"/>
        <circle cx="25" cy="154" r="6" fill="#7AA2F7"/>
        <text x="45" y="161" fill="#D7D9DD">sq CLI · agents</text>
      </g>
    </g>

    <path d="M356 238 H416" stroke="#59636E" stroke-width="3" stroke-linecap="round"/>
    <path d="M406 228 L416 238 L406 248" fill="none" stroke="#59636E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(442 98)">
      <text y="25" fill="#ECECEF" font-size="26" font-weight="650">Store locally</text>
      <text y="58" fill="#9CA2AA" font-size="19">One Rust core, one source of truth.</text>
      <rect y="91" width="316" height="180" rx="18" fill="#20262D" stroke="#3C444E"/>
      <text x="24" y="128" fill="#7AA2F7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="600">sidequest-core</text>
      <path d="M24 148 H292" stroke="#343C45"/>
      <text x="24" y="181" fill="#D7D9DD" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">validate → atomic write</text>
      <rect x="24" y="204" width="268" height="43" rx="10" fill="#171C22" stroke="#343C45"/>
      <text x="42" y="232" fill="#C6944B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">.sidequest/quests/*.md</text>
    </g>

    <path d="M788 238 H848" stroke="#59636E" stroke-width="3" stroke-linecap="round"/>
    <path d="M838 228 L848 238 L838 248" fill="none" stroke="#59636E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(874 98)">
      <text y="25" fill="#ECECEF" font-size="26" font-weight="650">Recall</text>
      <text y="58" fill="#9CA2AA" font-size="19">Return when the timing is right.</text>
      <g transform="translate(0 91)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">
        <rect width="270" height="52" rx="12" fill="#20262D" stroke="#3C444E"/>
        <circle cx="25" cy="26" r="6" fill="#C6944B"/>
        <text x="45" y="33" fill="#D7D9DD">Board · search</text>
        <rect y="64" width="270" height="52" rx="12" fill="#20262D" stroke="#3C444E"/>
        <circle cx="25" cy="90" r="6" fill="#C6944B"/>
        <text x="45" y="97" fill="#D7D9DD">Inbox → Ready</text>
        <rect y="128" width="270" height="52" rx="12" fill="#20262D" stroke="#3C444E"/>
        <circle cx="25" cy="154" r="6" fill="#C6944B"/>
        <text x="45" y="161" fill="#D7D9DD">CLI · coding agents</text>
      </g>
    </g>
  </g>
</svg>
